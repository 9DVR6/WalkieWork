<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Walkie PTT Directo</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #121417; --panel: #1e2227; --text: #f0f4f8;
      --muted: #8b949e; --green: #2ea043; --red: #da3633;
      --blue: #2f81f7; --amber: #d29922;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: var(--panel); padding: 14px 20px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d;
    }
    header h1 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .led { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
    .led.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .led.busy { background: var(--red); box-shadow: 0 0 8px var(--red); }

    #login-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 25px; max-width: 400px; margin: 0 auto; width: 100%;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d;
      background: var(--panel); color: var(--text); font-size: 1rem; outline: none;
    }
    button.primary-btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--blue); color: #fff; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-top: 18px;
    }
    button.primary-btn:disabled { opacity: 0.5; }
    #log-box {
      margin-top: 14px; font-size: 0.8rem; color: var(--amber);
      text-align: center; min-height: 20px;
    }

    #radio-screen {
      display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .status-card {
      background: var(--panel); border-radius: 12px; padding: 14px;
      text-align: center; border: 1px solid #30363d;
    }
    #channel-display { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    #status-text { font-size: 1.3rem; font-weight: bold; margin: 8px 0; color: var(--green); }
    #peers-list { font-size: 0.85rem; color: var(--muted); }

    .ptt-container { flex: 1; display: flex; justify-content: center; align-items: center; }
    #ptt-btn {
      width: 230px; height: 230px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2c313a, #181b20);
      border: 8px solid #30363d; color: var(--text); font-size: 1.15rem; font-weight: bold;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.6); cursor: pointer; touch-action: none;
    }
    #ptt-btn svg { width: 48px; height: 48px; margin-bottom: 10px; fill: currentColor; }
    #ptt-btn.transmitting { transform: scale(0.95); border-color: var(--red); color: #ff7b72; }
    #ptt-btn.receiving { border-color: var(--amber); color: #e3b341; }
