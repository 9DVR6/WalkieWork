<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Walkie PTT Directo</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #121417; --panel: #1e2227; --text: #f0f4f8;
      --muted: #8b949e; --green: #2ea043; --red: #da3633;
      --blue: #2f81f7; --amber: #d29922;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: var(--panel); padding: 14px 20px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d;
    }
    header h1 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .led { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
    .led.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .led.busy { background: var(--red); box-shadow: 0 0 8px var(--red); }

    #login-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 25px; max-width: 400px; margin: 0 auto; width: 100%;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d;
      background: var(--panel); color: var(--text); font-size: 1rem; outline: none;
    }
    button.primary-btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--blue); color: #fff; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-top: 18px;
    }
    button.primary-btn:disabled { opacity: 0.5; }
    #log-box {
      margin-top: 14px; font-size: 0.8rem; color: var(--amber);
      text-align: center; min-height: 20px;
    }

    #radio-screen {
      display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .status-card {
      background: var(--panel); border-radius: 12px; padding: 14px;
      text-align: center; border: 1px solid #30363d;
    }
    #channel-display { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    #status-text { font-size: 1.3rem; font-weight: bold; margin: 8px 0; color: var(--green); }
    #peers-list { font-size: 0.85rem; color: var(--muted); }

    .ptt-container { flex: 1; display: flex; justify-content: center; align-items: center; }
    #ptt-btn {
      width: 230px; height: 230px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2c313a, #181b20);
      border: 8px solid #30363d; color: var(--text); font-size: 1.15rem; font-weight: bold;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.6); cursor: pointer; touch-action: none;
    }
    #ptt-btn svg { width: 48px; height: 48px; margin-bottom: 10px; fill: currentColor; }
    #ptt-btn.transmitting { transform: scale(0.95); border-color: var(--red); color: #ff7b72; }
    #ptt-btn.receiving { border-color: var(--amber); color: #e3b341; }

    .footer-controls {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; color: var(--muted);
    }
    #disconnect-btn {
      background: transparent; border: 1px solid #30363d; color: var(--muted);
      padding: 8px 14px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1><span id="status-led" class="led"></span> WALKIE PTT</h1>
    <span id="wake-badge" style="font-size: 0.75rem; color: var(--muted);">Desconectado</span>
  </header>

  <div id="login-screen">
    <label for="username">Tu nombre / Indicativo</label>
    <input type="text" id="username" placeholder="Ej. Carlos" maxlength="15">

    <label for="channel">Nombre del Canal (igual para todos)</label>
    <input type="text" id="channel" placeholder="Ej. almacen-noche" autocapitalize="none">

    <button class="primary-btn" id="connect-btn">CONECTAR AL CANAL</button>
    <div id="log-box"></div>
  </div>

  <div id="radio-screen">
    <div class="status-card">
      <div id="channel-display">CANAL: ---</div>
      <div id="status-text">CANAL LIBRE</div>
      <div id="peers-list">Conectando...</div>
    </div>

    <div class="ptt-container">
      <button id="ptt-btn">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        <span id="ptt-label">PULSA Y HABLA</span>
      </button>
    </div>

    <div class="footer-controls">
      <span>Audio 2º plano listo</span>
      <button id="disconnect-btn">Salir</button>
    </div>
  </div>

  <div id="audio-container" style="display:none;"></div>

  <script>
    const ICE_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const myId = 'u-' + Math.random().toString(36).substring(2, 10);
    let myName = '';
    let channelTopic = '';
    let client = null;
    let localStream = null;
    let audioCtx = null;
    let silentAudioEl = null;

    const pcs = {};       // peerId -> RTCPeerConnection
    const peerNames = {}; // peerId -> nombre
    let isTransmitting = false;
    let activeSpeaker = null;

    const logBox = document.getElementById('log-box');
    const connectBtn = document.getElementById('connect-btn');
    const pttBtn = document.getElementById('ptt-btn');

    if (localStorage.getItem('walkie_name')) {
      document.getElementById('username').value = localStorage.getItem('walkie_name');
    }

    function log(msg) { logBox.textContent = msg; }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freqs) {
      try {
        initAudio();
        let t = audioCtx.currentTime;
        freqs.forEach(([f, dur]) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.22, t);
          g.gain.exponentialRampToValueAtTime(0.01, t + dur);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + dur);
          t += dur + 0.01;
        });
      } catch (e) {}
    }

    function enableKeepAlive() {
      try {
        silentAudioEl = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
        silentAudioEl.loop = true;
        silentAudioEl.volume = 0.01;
        silentAudioEl.play().catch(() => {});
      } catch (e) {}
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({ title: 'Walkie PTT', artist: channelTopic });
          navigator.mediaSession.playbackState = 'playing';
        } catch (e) {}
      }
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(() => {
          document.getElementById('wake-badge').textContent = 'Pantalla activa';
        }).catch(() => {});
      }
    }

    connectBtn.addEventListener('click', async () => {
      myName = document.getElementById('username').value.trim() || 'Compañero';
      const rawChannel = document.getElementById('channel').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
      if (!rawChannel) { log('Escribe un nombre de canal.'); return; }

      localStorage.setItem('walkie_name', myName);
      channelTopic = `walkie-ptt-es/${rawChannel}`;
      connectBtn.disabled = true;
      initAudio();

      log('1/2 Pidiendo micrófono...');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        localStream.getAudioTracks().forEach(t => t.enabled = false);
      } catch (e) {
        log('Aviso: sin micrófono (' + e.name + '), entrando en modo escucha...');
      }

      log('2/2 Conectando al canal...');
      if (typeof mqtt === 'undefined') {
        log('Error: bloqueada la librería MQTT. Desactiva bloqueadores.');
        connectBtn.disabled = false;
        return;
      }

      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: myId,
        clean: true,
        connectTimeout: 8000
      });

      client.on('connect', () => {
        client.subscribe(channelTopic, (err) => {
          if (err) { log('Error al suscribirse al canal.'); connectBtn.disabled = false; return; }
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('radio-screen').style.display = 'flex';
          document.getElementById('channel-display').textContent = 'CANAL: ' + rawChannel;
          document.getElementById('status-led').classList.add('online');
          enableKeepAlive();
          sendSignal({ type: 'join', name: myName });
          updatePeersUI();
        });
      });

      client.on('error', (err) => {
        log('Error de red: ' + err.message);
        connectBtn.disabled = false;
      });

      client.on('message', async (topic, message) => {
        let data;
        try { data = JSON.parse(message.toString()); } catch (e) { return; }
        if (data.from === myId) return;
        if (data.to && data.to !== myId) return;

        if (data.type === 'join') {
          peerNames[data.from] = data.name;
          updatePeersUI();
          sendSignal({ type: 'welcome', to: data.from, name: myName });
          await createOffer(data.from);
        } else if (data.type === 'welcome') {
          peerNames[data.from] = data.name;
          updatePeersUI();
        } else if (data.type === 'offer') {
          peerNames[data.from] = data.name;
          updatePeersUI();
          await handleOffer(data.from, data.sdp);
        } else if (data.type === 'answer') {
          if (pcs[data.from]) await pcs[data.from].setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === 'ice') {
          if (pcs[data.from] && data.candidate) {
            try { await pcs[data.from].addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
          }
        } else if (data.type === 'ptt-start') {
          activeSpeaker = data.name;
          playBeep([[1300, 0.06]]);
          updateUI();
        } else if (data.type === 'ptt-stop') {
          activeSpeaker = null;
          playBeep([[1400, 0.05], [1850, 0.09]]);
          updateUI();
        } else if (data.type === 'leave') {
          delete peerNames[data.from];
          if (pcs[data.from]) { pcs[data.from].close(); delete pcs[data.from]; }
          updatePeersUI();
        }
      });
    });

    function sendSignal(payload) {
      if (client && client.connected) {
        client.publish(channelTopic, JSON.stringify({ ...payload, from: myId }));
      }
    }

    function getPeerConnection(remoteId) {
      if (pcs[remoteId]) pcs[remoteId].close();
      const pc = new RTCPeerConnection(ICE_CONFIG);
      pcs[remoteId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      } else {
        pc.addTransceiver('audio', { direction: 'recvonly' });
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) sendSignal({ type: 'ice', to: remoteId, candidate: e.candidate });
      };

      pc.ontrack = (e) => {
        let el = document.getElementById('aud-' + remoteId);
        if (!el) {
          el = document.createElement('audio');
          el.id = 'aud-' + remoteId;
          el.autoplay = true;
          el.playsInline = true;
          document.getElementById('audio-container').appendChild(el);
        }
        el.srcObject = e.streams[0];
      };

      return pc;
    }

    async function createOffer(remoteId) {
      const pc = getPeerConnection(remoteId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal({ type: 'offer', to: remoteId, name: myName, sdp: pc.localDescription });
    }

    async function handleOffer(remoteId, sdp) {
      const pc = getPeerConnection(remoteId);
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', to: remoteId, sdp: pc.localDescription });
    }

    function updatePeersUI() {
      const names = Object.values(peerNames);
      document.getElementById('peers-list').textContent = names.length
        ? `En línea (${names.length + 1}): Tú, ${names.join(', ')}`
        : 'Conectado: Esperando compañeros...';
    }

    function updateUI() {
      const led = document.getElementById('status-led');
      const st = document.getElementById('status-text');
      const lbl = document.getElementById('ptt-label');
      if (isTransmitting) {
        led.className = 'led busy'; st.style.color = 'var(--red)';
        st.textContent = 'TRANSMITIENDO...'; pttBtn.className = 'transmitting';
        lbl.textContent = 'SUELTA AL ACABAR';
      } else if (activeSpeaker) {
        led.className = 'led busy'; st.style.color = 'var(--amber)';
        st.textContent = 'HABLANDO: ' + activeSpeaker.toUpperCase();
        pttBtn.className = 'receiving'; lbl.textContent = 'ESCUCHANDO...';
      } else {
        led.className = 'led online'; st.style.color = 'var(--green)';
        st.textContent = 'CANAL LIBRE'; pttBtn.className = '';
        lbl.textContent = 'PULSA Y HABLA';
      }
    }

    function startTalk(e) {
      if (e) e.preventDefault();
      if (isTransmitting || !localStream) return;
      if (navigator.vibrate) navigator.vibrate(40);
      isTransmitting = true;
      localStream.getAudioTracks().forEach(t => t.enabled = true);
      playBeep([[1300, 0.06]]);
      sendSignal({ type: 'ptt-start', name: myName });
      updateUI();
    }

    function stopTalk(e) {
      if (e) e.preventDefault();
      if (!isTransmitting) return;
      isTransmitting = false;
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      playBeep([[1400, 0.05], [1850, 0.09]]);
      sendSignal({ type: 'ptt-stop', name: myName });
      updateUI();
    }

    pttBtn.addEventListener('touchstart', startTalk, { passive: false });
    pttBtn.addEventListener('touchend', stopTalk, { passive: false });
    pttBtn.addEventListener('touchcancel', stopTalk, { passive: false });
    pttBtn.addEventListener('mousedown', startTalk);
    window.addEventListener('mouseup', () => { if (isTransmitting) stopTalk(); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.getElementById('radio-screen').style.display === 'flex' && !e.repeat) startTalk();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && document.getElementById('radio-screen').style.display === 'flex') stopTalk();
    });

    document.getElementById('disconnect-btn').addEventListener('click', () => {
      sendSignal({ type: 'leave' });
      if (client) client.end();
      location.reload();
    });
  </script>
</body>
</html>
