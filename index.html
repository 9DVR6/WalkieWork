<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Walkie-Talkie PTT</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #121417;
      --panel: #1e2227;
      --text: #f0f4f8;
      --muted: #8b949e;
      --green: #2ea043;
      --red: #da3633;
      --blue: #2f81f7;
      --amber: #d29922;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.2s;
    }
    .led.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .led.busy { background: var(--red); box-shadow: 0 0 8px var(--red); }

    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .input-group { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--blue); }

    button.primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: none;
      background: var(--blue);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.primary-btn:disabled { opacity: 0.6; }

    #radio-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .status-card {
      background: var(--panel);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid #30363d;
    }

    #channel-display {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #status-text {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 8px 0;
      color: var(--green);
    }

    #peers-list {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .ptt-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #ptt-btn {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2c313a, #181b20);
      border: 8px solid #30363d;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.6);
      cursor: pointer;
      touch-action: none;
    }

    #ptt-btn svg {
      width: 48px;
      height: 48px;
      margin-bottom: 10px;
      fill: currentColor;
    }

    #ptt-btn.transmitting {
      transform: scale(0.95);
      border-color: var(--red);
      color: #ff7b72;
    }

    #ptt-btn.receiving {
      border-color: var(--amber);
      color: #e3b341;
    }

    .footer-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    #disconnect-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    #audio-container { display: none; }
  </style>
</head>
<body>

  <header>
    <h1><span id="status-led" class="led"></span> WALKIE PTT</h1>
    <span id="wake-badge" style="font-size: 0.75rem; color: var(--muted);">Desconectado</span>
  </header>

  <div id="login-screen">
    <div class="input-group">
      <label for="username">Tu nombre / Indicativo</label>
      <input type="text" id="username" placeholder="Ej. Carlos" maxlength="15">
    </div>
    <div class="input-group">
      <label for="channel">Nombre del Canal (igual para todos)</label>
      <input type="text" id="channel" placeholder="Ej. almacen-noche" autocapitalize="none">
    </div>
    <button class="primary-btn" id="connect-btn">CONECTAR AL CANAL</button>
    <p id="error-msg" style="color: #ff7b72; font-size: 0.85rem; text-align: center; margin-top: 15px;"></p>
  </div>

  <div id="radio-screen">
    <div class="status-card">
      <div id="channel-display">CANAL: ---</div>
      <div id="status-text">CANAL LIBRE</div>
      <div id="peers-list">Esperando compañeros...</div>
    </div>

    <div class="ptt-container">
      <button id="ptt-btn">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        <span id="ptt-label">PULSA Y HABLA</span>
      </button>
    </div>

    <div class="footer-controls">
      <span>2º plano activo</span>
      <button id="disconnect-btn">Salir del canal</button>
    </div>
  </div>

  <div id="audio-container"></div>

  <script>
    let peer = null;
    let localStream = null;
    let audioCtx = null;
    let wakeLock = null;
    let silentAudioEl = null;

    let myName = '';
    let channelName = '';
    let connections = {};
    let calls = {};
    let peerNames = {};
    let isTransmitting = false;
    let activeSpeaker = null;

    const loginScreen = document.getElementById('login-screen');
    const radioScreen = document.getElementById('radio-screen');
    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const pttBtn = document.getElementById('ptt-btn');
    const pttLabel = document.getElementById('ptt-label');
    const statusText = document.getElementById('status-text');
    const peersList = document.getElementById('peers-list');
    const statusLed = document.getElementById('status-led');
    const wakeBadge = document.getElementById('wake-badge');
    const errorMsg = document.getElementById('error-msg');

    if (localStorage.getItem('walkie_name')) {
      document.getElementById('username').value = localStorage.getItem('walkie_name');
    }

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTxStartBeep() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1600, now + 0.06);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } catch (e) {}
    }

    function playRogerBeep() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(1400, now);
        gain1.gain.setValueAtTime(0.2, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.06);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(1850, now + 0.065);
        gain2.gain.setValueAtTime(0.25, now + 0.065);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.065);
        osc2.stop(now + 0.16);
      } catch (e) {}
    }

    function enableBackgroundKeepAlive() {
      try {
        const silentWavBase64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        silentAudioEl = new Audio(silentWavBase64);
        silentAudioEl.loop = true;
        silentAudioEl.volume = 0.01;
        silentAudioEl.play().catch(() => {});
      } catch (e) {}

      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: `Canal: ${channelName}`,
            artist: 'Walkie-Talkie Activo',
            album: 'Comunicación en directo'
          });
          navigator.mediaSession.playbackState = 'playing';
        } catch (e) {}
      }

      requestWakeLock();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          requestWakeLock();
          if (silentAudioEl && silentAudioEl.paused) silentAudioEl.play().catch(() => {});
        }
      });
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeBadge.textContent = "Pantalla activa";
        } catch (err) {
          wakeBadge.textContent = "En línea";
        }
      } else {
        wakeBadge.textContent = "En línea";
      }
    }

    connectBtn.addEventListener('click', async () => {
      myName = document.getElementById('username').value.trim() || 'Compañero';
      channelName = document.getElementById('channel').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');

      if (!channelName) {
        errorMsg.textContent = "Escribe un nombre de canal válido (letras o números).";
        return;
      }

      localStorage.setItem('walkie_name', myName);
      errorMsg.textContent = "Solicitando permiso de micrófono...";
      connectBtn.disabled = true;

      try {
        initAudioContext();
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });
          setMicEnabled(false);
        } else {
          errorMsg.textContent = "Este navegador no permite micrófono (modo solo escucha).";
        }
      } catch (err) {
        console.warn("Aviso micrófono:", err);
        errorMsg.textContent = "Sin acceso al micrófono (" + (err.name || "permiso denegado") + "). Entrando en modo escucha...";
      }

      startPeerConnection();
    });

    function startPeerConnection() {
      if (typeof Peer === 'undefined') {
        errorMsg.textContent = "No se pudo cargar PeerJS. Revisa conexión o bloqueadores de anuncios.";
        connectBtn.disabled = false;
        return;
      }

      errorMsg.textContent = "Conectando al servidor de sala...";
      const uniqueId = `wt-${channelName}-${Math.random().toString(36).substring(2, 8)}`;

      peer = new Peer(uniqueId, { debug: 1 });

      const timeout = setTimeout(() => {
        if (!peer || !peer.open) {
          errorMsg.textContent = "Tarda demasiado en conectar con el servidor PeerJS. Inténtalo de nuevo.";
          connectBtn.disabled = false;
        }
      }, 10000);

      peer.on('open', () => {
        clearTimeout(timeout);
        errorMsg.textContent = "";
        onConnectedToChannel();
      });

      peer.on('error', (err) => {
        clearTimeout(timeout);
        console.error("Peer error:", err);
        errorMsg.textContent = "Error de conexión: " + (err.type || err.message || err);
        connectBtn.disabled = false;
      });
    }

    function onConnectedToChannel() {
      loginScreen.style.display = 'none';
      radioScreen.style.display = 'flex';
      document.getElementById('channel-display').textContent = `CANAL: ${channelName}`;
      statusLed.classList.add('online');
      enableBackgroundKeepAlive();

      peer.on('call', (call) => {
        call.answer(localStream || undefined);
        setupCallAudio(call);
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      updatePeersUI();
    }

    function setupDataConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'hello', name: myName });
        updatePeersUI();
      });

      conn.on('data', (data) => {
        if (data.type === 'hello') {
          peerNames[conn.peer] = data.name;
          updatePeersUI();
        } else if (data.type === 'ptt-start') {
          activeSpeaker = data.name;
          playTxStartBeep();
          updateRadioStateUI();
        } else if (data.type === 'ptt-stop') {
          activeSpeaker = null;
          playRogerBeep();
          updateRadioStateUI();
        }
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete peerNames[conn.peer];
        updatePeersUI();
      });
    }

    function setupCallAudio(call) {
      calls[call.peer] = call;
      call.on('stream', (remoteStream) => {
        let audioEl = document.getElementById(`audio-${call.peer}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio-${call.peer}`;
          audioEl.autoplay = true;
          audioEl.playsInline = true;
          document.getElementById('audio-container').appendChild(audioEl);
        }
        audioEl.srcObject = remoteStream;
      });
    }

    function broadcastData(payload) {
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    function updatePeersUI() {
      const names = Object.values(peerNames);
      if (names.length === 0) {
        peersList.textContent = "Conectado: Solo tú en el canal";
      } else {
        peersList.textContent = `En línea (${names.length + 1}): Tú, ${names.join(', ')}`;
      }
    }

    function updateRadioStateUI() {
      if (isTransmitting) {
        statusLed.className = 'led busy';
        statusText.style.color = 'var(--red)';
        statusText.textContent = "TRANSMITIENDO...";
        pttBtn.className = 'transmitting';
        pttLabel.textContent = "SUELTA AL ACABAR";
      } else if (activeSpeaker) {
        statusLed.className = 'led busy';
        statusText.style.color = 'var(--amber)';
        statusText.textContent = `HABLANDO: ${activeSpeaker.toUpperCase()}`;
        pttBtn.className = 'receiving';
        pttLabel.textContent = "ESCUCHANDO...";
      } else {
        statusLed.className = 'led online';
        statusText.style.color = 'var(--green)';
        statusText.textContent = "CANAL LIBRE";
        pttBtn.className = '';
        pttLabel.textContent = "PULSA Y HABLA";
      }
    }

    function setMicEnabled(enabled) {
      if (!localStream) return;
      localStream.getAudioTracks().forEach(track => {
        track.enabled = enabled;
      });
    }

    function startTalking(e) {
      if (e) e.preventDefault();
      if (isTransmitting || !localStream) return;

      if (navigator.vibrate) navigator.vibrate(40);

      isTransmitting = true;
      setMicEnabled(true);
      playTxStartBeep();
      broadcastData({ type: 'ptt-start', name: myName });
      updateRadioStateUI();
    }

    function stopTalking(e) {
      if (e) e.preventDefault();
      if (!isTransmitting) return;

      isTransmitting = false;
      setMicEnabled(false);
      playRogerBeep();
      broadcastData({ type: 'ptt-stop', name: myName });
      updateRadioStateUI();
    }

    pttBtn.addEventListener('touchstart', startTalking, { passive: false });
    pttBtn.addEventListener('touchend', stopTalking, { passive: false });
    pttBtn.addEventListener('touchcancel', stopTalking, { passive: false });

    pttBtn.addEventListener('mousedown', startTalking);
    window.addEventListener('mouseup', () => {
      if (isTransmitting) stopTalking();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && radioScreen.style.display === 'flex' &&
